apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo
  namespace: demo
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
spec:
  ingressClassName: demo-alb
  rules:
    - host: demo.xiezhao.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-active
                port:
                  number: 80
  tls:
    - hosts:
        - demo.xiezhao.me
