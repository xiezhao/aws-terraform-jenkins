apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-green
  labels:
    app.kubernetes.io/name: demo
    app.kubernetes.io/component: green
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
      color: green
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo
        color: green
    spec:
      containers:
        - name: app
          image: 025066243171.dkr.ecr.ap-southeast-1.amazonaws.com/demo-service:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DEPLOY_COLOR
              value: green
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
