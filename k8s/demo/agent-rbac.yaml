apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-release
rules:
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services]
    resourceNames: [demo-active]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-release-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-release
subjects:
  - kind: ServiceAccount
    name: jenkins-release
    namespace: jenkins
